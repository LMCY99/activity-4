<!DOCTYPE html>
<html>
  <head>
    <title>Introduction to CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>
      h1 {
        color: gold;
        font-family: Arial, sans-serif;
        margin-top: 40px;
      }

      li {
        font-weight: bold;
        margin: 8px 0;
        line-height: 1.5;
      }
    </style>
  </head>

  <body style="background-color: white; padding: 20px;">

    <h1>My Favourite Food</h1>
    <p>The list below is showing my favourite food :</p>
    <ol>
      <li>Chicken Rice</li>
      <li>Fried Noodle</li>
      <li>Nasi Lemak</li>
    </ol>

    <h1>My Hobby</h1>
    <p>My hobbies help me relax, stay creative, and learn something new.</p>
    <ul>
      <li>Reading books</li>
      <li>Playing Football</li>
      <li>Watching Football Matches</li>
    </ul>

  </body>
</html>
